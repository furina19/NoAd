name: Build APK

# 允许 Action 把生成的签名密钥提交回仓库
permissions:
  contents: write

# 当推送到 main 分支或手动触发时构建
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # 允许手动触发
    inputs:
      buildType:
        description: '构建类型'
        required: true
        type: choice
        default: 'debug'
        options:
          - debug
          - release

jobs:
  build:
    name: 编译 APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: ☕ 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 关键：仓库里有固定签名就用它；没有才生成一次并提交回仓库
      # 这样每次 CI 构建、以及本地构建，签名永远一致
      - name: 🔑 准备固定签名密钥
        run: |
          if [ -f noad.keystore ]; then
            echo "✅ 复用仓库中已有的固定签名密钥（签名保持一致）"
          else
            echo "🆕 仓库中没有签名密钥，生成并提交回仓库（以后所有构建共用）"
            keytool -genkeypair \
              -keystore noad.keystore \
              -alias noad \
              -keyalg RSA \
              -keysize 2048 \
              -validity 30000 \
              -storepass noad123 \
              -keypass noad123 \
              -dname "CN=NoAd, OU=NoAd, O=NoAd, L=Unknown, ST=Unknown, C=CN" \
              -noprompt
            git config user.name "NoAd Bot"
            git config user.email "noad-bot@users.noreply.github.com"
            git add noad.keystore
            git commit -m "chore: add fixed signing keystore [skip ci]" || true
            git push || echo "⚠️ 推送失败，请手动把 noad.keystore 提交到仓库"
          fi

      - name: 🛠 设置 Gradle
        uses: gradle/actions/setup-gradle@v3

        with:
          gradle-version: 8.5
      - name: 🔨 编译 Debug APK
        if: ${{ github.event.inputs.buildType != 'release' }}
        run: gradle assembleDebug

      - name: 🔨 编译 Release APK
        if: ${{ github.event.inputs.buildType == 'release' }}
        run: gradle assembleRelease

      - name: 📦 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: NoAd-APK
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          compression-level: 6

      - name: 📋 APK 信息
        run: |
          echo "## 🐟 构建完成！" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 文件 | 大小 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          find app/build/outputs/apk -name "*.apk" -exec sh -c 'echo "| $(basename {}) | $(du -sh {} | cut -f1) |"' \; >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔑 使用仓库固定的 noad.keystore 签名，同仓库的所有构建可互相覆盖安装" >> $GITHUB_STEP_SUMMARY