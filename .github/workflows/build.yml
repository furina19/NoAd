name: Build APK

# 当推送到 main 分支或手动触发时构建
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # 允许手动触发
    inputs:
      buildType:
        description: '构建类型'
        required: true
        type: choice
        default: 'debug'
        options:
          - debug
          - release

jobs:
  build:
    name: 编译 APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: ☕ 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 生成固定签名密钥（解决"不能覆盖旧版本"问题）
      - name: 🔑 生成固定签名密钥
        run: |
          keytool -genkey -v \
            -keystore noad.keystore \
            -alias noad \
            -keyalg RSA \
            -keysize 2048 \
            -validity 30000 \
            -storepass noad123 \
            -keypass noad123 \
            -dname "CN=NoAd, OU=NoAd, O=NoAd, L=Unknown, ST=Unknown, C=CN" \
            -noprompt
          echo "✅ 固定签名密钥已生成"

      - name: 🛠 设置 Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🔨 编译 Debug APK
        if: ${{ github.event.inputs.buildType != 'release' }}
        run: gradle assembleDebug

      - name: 🔨 编译 Release APK
        if: ${{ github.event.inputs.buildType == 'release' }}
        run: gradle assembleRelease

      - name: 📦 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: NoAd-APK
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          compression-level: 6

      - name: 📋 APK 信息
        run: |
          echo "## 🐟 构建完成！" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 文件 | 大小 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          find app/build/outputs/apk -name "*.apk" -exec sh -c 'echo "| $(basename {}) | $(du -sh {} | cut -f1) |"' \; >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔑 使用固定签名，可直接覆盖安装旧版本（仅限同一来源编译的 APK）" >> $GITHUB_STEP_SUMMARY